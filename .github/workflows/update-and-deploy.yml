name: Actualizar feeds y publicar

on:
  schedule:
    - cron: "17 */6 * * *"     # cada 6 horas (UTC)
  workflow_dispatch:            # botón "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar feeds
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: python scripts/update_feeds.py

      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: actualización automática $(date -u '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
